# HotpotQA+Search — 轨迹价值调度（V_sys + 负反馈 + belief HOT/WARM/COLD）
# EnvAffinityRouter：ordering + placement 均由 trajectory value 驱动
defaults:
  - gem_math_hotpotqa_search_ds_sglang
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: agentic_hotpotqa_search_ds_sglang_router_trajectory_value

logging_dir: ./output/ablation_router_hotpotqa/trajectory_value/logs
output_dir: ./output/ablation_router_hotpotqa/trajectory_value

tracker_kwargs:
  log_dir: ./output/ablation_router_hotpotqa/trajectory_value/tb

checkpoint_config:
  type: file_system
  output_dir: ./output/ablation_router_hotpotqa/trajectory_value/checkpoints

router_args:
  router_name: EnvAffinityRouter
  router_config:
    enable_resume_priority: true
    enable_resume_aware_routing: true
    enable_request_priority_queue: true
    enable_trajectory_value_scheduling: true
    enable_belief_feedback: true
    enable_value_driven_lease: true
    enable_lookup_resume: false
    enable_gateway_kv_lease_push: false
    enable_refresh_resume_priority_on_dispatch: true
    resume_normal_quota: "3:1"
    normal_max_queue_wait_s: 10.0
    resume_max_queue_wait_s: 5.0
    force_migrate_age_s: 30.0
    trajectory_value_weights:
      w_p: 1.0
      w_f: 0.5
      w_a: 0.3
      w_c: 0.8
      w_q: 0.5
    learning_penalty_weights:
      c_inv: 1.5
      c_loop: 1.0
      c_stall: 0.5
      c_term: 10.0
    belief_config:
      p_hot: 0.85
      p_warm: 0.45
      p_cold: 0.10
      hot_pause_age_s: 5.0
      cold_pause_age_s: 30.0
