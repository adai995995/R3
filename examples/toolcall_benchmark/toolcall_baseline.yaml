defaults:
  - ../config/traj_envs_gem_math@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "toolcall_baseline"
seed: 42

logging_dir: ./output/toolcall_benchmark/baseline/logs
output_dir: ./output/toolcall_benchmark/baseline
system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: ./output/toolcall_benchmark/baseline/checkpoints

num_gpus_per_node: 1

# 快速测试 - 20 步
max_steps: 20
save_steps: 100
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

# 小批量快速测试
rollout_batch_size: 32
val_batch_size: 16
sequence_length: 4096

advantage_clip: 10
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

# 使用小模型
pretrain: Qwen/Qwen2.5-0.5B-Instruct
reward_pretrain: Qwen/Qwen2.5-0.5B-Instruct

actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_steps: 0
    lr_scheduler_type: cosine
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: false
  device_mapping: [0]
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step}
    top_p: 0.9
    top_k: 50
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop_strings: ["</code>"]
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
  device_mapping: [0]

reward_normalization:
  grouping: batch
  method: identity

# ===== BASELINE: 关闭所有 resume-aware 功能 =====
router_args:
  router_config:
    enable_resume_priority: false
    enable_resume_aware_routing: false
    enable_request_priority_queue: false

train_env_manager:
  max_env_num_per_worker: 8
  num_env_groups: 32
  group_size: 1
  tags: [dapo_17k_with_python_code]
  num_groups_partition: [32]

val_env_manager:
  max_env_num_per_worker: 8
  num_env_groups: 16
  group_size: 1
  tags: [dapo_17k_with_python_code]
  num_groups_partition: [16]

max_tokens_per_step: 512
math_agent_system_template: Please reason step by step, and put your final answer within '\\boxed{}', e.g. \\boxed{{A}}.
math_agent_template: "{observation}\nEnsure that your response includes the format of '\\boxed{{answer}}', e.g. \\boxed{{A}}."

custom_envs:
  dapo_17k_with_python_code:
    ${gem_math.dapo_17k_with_python_code}
