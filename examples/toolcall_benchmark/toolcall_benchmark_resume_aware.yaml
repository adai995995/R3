defaults:
  - ../config/traj_envs_gem_math@_here_
  - ../config/deepspeed_zero2@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "toolcall_benchmark_resume_aware"
seed: 42

logging_dir: ./output/toolcall_benchmark/resume_aware/logs
output_dir: ./output/toolcall_benchmark/resume_aware
rollout_dump_dir: ./output/toolcall_benchmark/resume_aware/rollout_dump

system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: ./output/toolcall_benchmark/resume_aware/checkpoints

num_gpus_per_node: 8
rpc_timeout: 3600
async_generation_ratio: 1

# 中等负载，足够体现调度差异
max_steps: 50
save_steps: 100
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

# 中等批量用于测试调度性能
rollout_batch_size: 64
val_batch_size: 32
sequence_length: 4096
max_tokens_per_step: 256

math_agent_system_template: >-
  You are a tool-using math assistant. For every problem, you must call the Python
  code tool at least once before giving the final answer. Put executable Python
  in <code>...</code> tags, print the computed result, then use the returned tool
  result to answer with \boxed{{answer}}. For multi-step arithmetic, you may call
  the tool multiple times.
math_agent_template: >-
  {observation}
  You must first use the Python tool by writing a complete executable script in
  <code>...</code>. Do not give the final \boxed{{answer}} until after at least one
  tool result has been returned.

# RL 参数
advantage_clip: 10
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

# 使用小模型快速测试
pretrain: Qwen/Qwen2.5-0.5B-Instruct
reward_pretrain: Qwen/Qwen2.5-0.5B-Instruct

actor_train:
  model_args:
    attn_implementation: ~
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    warmup_steps: 0
    lr_scheduler_type: cosine
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: deepspeed_train
    strategy_config: ${deepspeed_zero2}
  # Train on the last 2 GPUs; inference/rollout uses GPUs 0-5.
  device_mapping: [6, 7]
  infer_batch_size: 1
  model_update_frequency: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step}
    top_p: 0.9
    top_k: 50
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop_strings: ["</code>", "</code>\n"]
    include_stop_str_in_output: true
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.45
      skip_tokenizer_init: false
  # Rollout/inference on the first 6 GPUs, fully separated from actor_train.
  device_mapping: [0, 1, 2, 3, 4, 5]

# ===== RESUME-AWARE 配置：开启所有优化 =====
router_args:
  router_name: EnvAffinityRouter
  router_config:
    # 开启 resume-aware 调度
    enable_resume_priority: true
    enable_resume_aware_routing: true
    enable_request_priority_queue: true

    # Resume 与 normal 请求的软配额（3:1）
    resume_normal_quota: [3, 1]

    # 超时放行阈值（防止饥饿）
    normal_max_queue_wait_s: 10.0
    resume_max_queue_wait_s: 5.0

    # 强制迁移阈值（pause 超过 30s 后允许迁移）
    force_migrate_age_s: 30.0

    # Resume score 权重配置
    resume_score_weights:
      age: 1.0      # pause_age_s 的权重
      hist: 0.001   # history_len_tokens 的权重（负向）
      aff: 0.5      # affinity（是否为 last_backend）的权重
      load: 0.5     # worker_load 的权重（负向）
      fair: 0.0     # fairness_bonus 的权重

    # Request priority 权重配置
    request_score_weights:
      age: 1.0      # pause_age_s 的权重
      hist: 0.001   # history_len_tokens 的权重（负向）
      hit: 0.5      # hit_prob（是否有 last_backend_id）的权重
      rebuild: 0.0  # rebuild_cost 的权重（负向）
      fair: 0.0     # fairness_bonus 的权重

    # Aging 权重（防止排队饥饿）
    request_wait_aging_weight: 0.1

    # 动态配额（可选，首版可关闭）
    enable_adaptive_quota: false

    # 每个 worker 的最大并发请求数
    max_running_requests_per_worker: 16

# Tool-call 环境配置 - 使用 GSM8K 数学问题 + Python 工具
train_env_manager:
  max_env_num_per_worker: 8
  num_env_groups: 64
  group_size: 1
  tags: [GSM8K_with_python_code]
  num_groups_partition: [64]

val_env_manager:
  max_env_num_per_worker: 8
  num_env_groups: 32
  group_size: 1
  tags: [GSM8K_with_python_code]
  num_groups_partition: [32]

custom_envs:
  GSM8K_with_python_code:
    env_type: "roll_math"
    max_steps: ${max_actions_per_traj}
    max_tokens_per_step: ${max_tokens_per_step}
    env_manager_cls: ${env_manager_cls}
    agent_system_template: ${math_agent_system_template}
    agent_template: ${math_agent_template}
    env_config:
      max_steps: ${max_actions_per_traj}
      dataset_name: /export/xxl/R3/examples/toolcall_benchmark/data/tiny_gsm8k_toolcall.jsonl
      split: train
    tool_wrapper:
      wrapper_args:
        tool_reward: 0
        tool_success_reward: 0
        max_tool_uses: 5
      tool_configs:
        - tool_id: python_code
          tool_args:
            timeout: 5
            sleep_s: 3.0
            sandbox_type: none
            keep_error_last_line: false
