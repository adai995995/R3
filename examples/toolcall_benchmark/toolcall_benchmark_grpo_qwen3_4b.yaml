# GSM8K tool-call + Qwen3-4B + GRPO (8×H800: infer 0-5, train 6-7)
defaults:
  - ../config/traj_envs_gem_math@_here_
  - ../config/deepspeed_zero2@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "toolcall_benchmark_grpo_qwen3_4b"
seed: 42

logging_dir: ./output/toolcall_benchmark/grpo_qwen3_4b/logs
output_dir: ./output/toolcall_benchmark/grpo_qwen3_4b
rollout_dump_dir: ./output/toolcall_benchmark/grpo_qwen3_4b/rollout_dump

system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: ./output/toolcall_benchmark/grpo_qwen3_4b/checkpoints

num_gpus_per_node: 8
rpc_timeout: 3600
async_generation_ratio: 1

max_steps: 100
save_steps: 50
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

# GRPO: rollout_batch_size 必须能被 group_size 整除
rollout_batch_size: 128
val_batch_size: 64
sequence_length: 4096
max_tokens_per_step: 256

math_agent_system_template: >-
  You are a tool-using math assistant. For every problem, you must call the Python
  code tool at least once before giving the final answer. Put executable Python
  in <code>...</code> tags, print the computed result, then use the returned tool
  result to answer with \boxed{{answer}}. For multi-step arithmetic, you may call
  the tool multiple times.
math_agent_template: >-
  {observation}
  You must first use the Python tool by writing a complete executable script in
  <code>...</code>. Do not give the final \boxed{{answer}} until after at least one
  tool result has been returned.

# GRPO（组内 reward 归一化 + reinforce 回报）
advantage_clip: 0.2
ppo_epochs: 1
adv_estimator: "grpo"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

# Instruct 便于 tool-call；若无权重可改为 Qwen/Qwen3-4B-Base
pretrain: Qwen/Qwen3-4B-Instruct-2507
reward_pretrain: Qwen/Qwen3-4B-Instruct-2507

reward_normalization:
  grouping: traj_group_id
  method: mean_std

actor_train:
  model_args:
    attn_implementation: ~
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_steps: 10
    lr_scheduler_type: cosine
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: deepspeed_train
    strategy_config: ${deepspeed_zero2}
  device_mapping: [6, 7]
  infer_batch_size: 1
  model_update_frequency: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step}
    top_p: 0.95
    top_k: 50
    num_beams: 1
    temperature: 1.0
    num_return_sequences: 1
    stop_strings: ["</code>", "</code>\n"]
    include_stop_str_in_output: true
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: sglang
    strategy_config:
      # 4B 比 0.5B 占显存更多；OOM 时可降到 0.42 或减少 device_mapping 卡数
      mem_fraction_static: 0.50
      skip_tokenizer_init: false
  device_mapping: [0, 1, 2, 3, 4, 5]

router_args:
  router_name: EnvAffinityRouter
  router_config:
    enable_resume_priority: false
    enable_resume_aware_routing: false
    enable_request_priority_queue: false

# 并发：64 组 × group_size 8 = 512 条轨迹容量；16 个 EnvironmentWorker
train_env_manager:
  max_env_num_per_worker: 32
  num_env_groups: 64
  group_size: 8
  tags: [GSM8K_with_python_code]
  num_groups_partition: [64]

val_env_manager:
  max_env_num_per_worker: 16
  num_env_groups: 32
  group_size: 1
  tags: [GSM8K_with_python_code]
  num_groups_partition: [32]

custom_envs:
  GSM8K_with_python_code:
    env_type: "roll_math"
    max_steps: ${max_actions_per_traj}
    max_tokens_per_step: ${max_tokens_per_step}
    env_manager_cls: ${env_manager_cls}
    agent_system_template: ${math_agent_system_template}
    agent_template: ${math_agent_template}
    env_config:
      max_steps: ${max_actions_per_traj}
      dataset_name: /export/xxl/R3/examples/toolcall_benchmark/data/tiny_gsm8k_toolcall.jsonl
      split: train
    tool_wrapper:
      wrapper_args:
        tool_reward: 0
        tool_success_reward: 0
        max_tool_uses: 5
      tool_configs:
        - tool_id: python_code
          tool_args:
            timeout: 5
            sleep_s: 3.0
            sandbox_type: none
            keep_error_last_line: false
