defaults:
  - ../config/traj_envs_gem_math@_here_
  - ../config/deepspeed_zero@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "toolcall_benchmark_native"
seed: 42

logging_dir: ./output/toolcall_benchmark/native/logs
output_dir: ./output/toolcall_benchmark/native
rollout_dump_dir: ./output/toolcall_benchmark/native/rollout_dump

system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: ./output/toolcall_benchmark/native/checkpoints

num_gpus_per_node: 1
rpc_timeout: 3600

# 快速测试配置 - 只跑少量步数来测试调度性能
max_steps: 20
save_steps: 100
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

# 中等批量用于测试调度性能
rollout_batch_size: 32
val_batch_size: 16
sequence_length: 4096
max_tokens_per_step: 256

# RL 参数
advantage_clip: 10
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

# 使用小模型快速测试
pretrain: Qwen/Qwen2.5-0.5B-Instruct
reward_pretrain: Qwen/Qwen2.5-0.5B-Instruct

actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_steps: 0
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: huggingface_train
  device_mapping: [0]
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step}
    top_p: 0.9
    top_k: 50
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop_strings: ["</tool_call>", "</tool_call>\n"]
    include_stop_str_in_output: true
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: sglang_infer  # 使用原生 SGLang
    strategy_config:
      tp_size: 1
      enable_metrics: true
      log_stats: true
  device_mapping: [0]

# Tool-call 环境配置 - 使用 GSM8K 数学问题 + Python 工具
train_env_manager:
  max_env_num_per_worker: 8
  num_env_groups: 32
  group_size: 1
  tags: [GSM8K_with_python_code]
  num_groups_partition: [32]

val_env_manager:
  max_env_num_per_worker: 8
  num_env_groups: 16
  group_size: 1
  tags: [GSM8K_with_python_code]
  num_groups_partition: [16]
